<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
 
  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Lista Alumnos
  </h1>
 
  <form [formGroup]="formulario">
    <!-- Matricula -->
    <div class="mb-5">
 
      <label
        for="matricula"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Matricula
      </label>
 
      <input
        type="text"
        id="matricula"
        name="matricula"
        formControlName="matricula"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Pon tu matricula"
      >
 
 
    </div>
    <!-- Nombre -->
    <div class="mb-5">
 
      <label
        for="name"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Nombre
      </label>
 
      <input
        type="text"
        id="name"
        name="name"
        formControlName="nombre"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Ingresa tu nombre"
      >
 
    </div>
    <!-- Correo -->
    <div class="mb-5">
 
      <label
        for="correo"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Correo
      </label>
 
      <input
        type="text"
        id="correo"
        name="correo"
        formControlName="correo"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Ingresa tu correo"
      >
 
    </div>
    <!-- Materia -->
    <div class="mb-5">
 
      <label
        for="materia"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Materia
      </label>
 
      <input
        type="text"
        id="materia"
        name="materia"
        formControlName="materia"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Ingresa tu materia"
      >
 
 
    </div>
 
      <!-- Botón -->
      <div class="flex justify-center mt-5" (click)="muestraAlumnos()">
 
        <button
          type="submit"
         
          class="text-white bg-blue-700 hover:bg-blue-800
                 focus:ring-4 focus:outline-none focus:ring-blue-300
                 font-medium rounded-lg text-sm px-5 py-2.5
                 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Registrar
        </button>
 
      </div>
      <h2 class="flex justify-center mt-2"> Matricula: {{alumno.matricula}}</h2>
      <h2 class="flex justify-center mt-2"> Nombre: {{alumno.nombre}}</h2>
      <h2 class="flex justify-center mt-2"> Correo: {{alumno.correo}}</h2>
      <h2 class="flex justify-center mt-2"> Materia: {{alumno.materia}}</h2>
 
  </form>

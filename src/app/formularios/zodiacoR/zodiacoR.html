<div class="max-w-5xl mx-auto p-6 rounded-lg my-8">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
    
    <div>
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-6 border-b pb-2">
        Datos Personales
      </h2>

      <form [formGroup]="formulario">
        
        <!-- Nombre -->
        <div>
          <label for="nombre" class="block mb-2 text-sm font-medium">
            Nombre
          </label>
          <input
            type="text"
            id="nombre"
            formControlName="nombre"
            placeholder="Nombre"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          >
        </div>

        <div>
          <label for="apellidop" class="block mb-2 text-sm font-medium">
            Apellido Paterno
          </label>
          <input
            type="text"
            id="apellidop"
            formControlName="apellidop"
            placeholder="Apellido Paterno"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          >
        </div>

        <div>
          <label for="apellidom" class="block mb-2 text-sm font-medium">
            Apellido Materno
          </label>
          <input
            type="text"
            id="apellidom"
            formControlName="apellidom"
            placeholder="Apellido Materno"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          >
        </div>

        <label class="block mb-2 text-sm font-medium mt-4">
          Fecha de nacimiento
        </label>
        
        <!-- Fecha de nacimiento -->
        <div>
          <div class="grid grid-cols-3 gap-3">
            <div>
              <input
                type="number"
                formControlName="dia"
                placeholder="Día"
                class="bg-gray-50 border text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              >
            </div>
            <div>
              <input
                type="number"
                formControlName="mes"
                placeholder="Mes"
                class="bg-gray-50 border text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              >
            </div>
            <div>
              <input
                type="number"
                formControlName="anio"
                placeholder="Año"
                class="bg-gray-50 border text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              >
            </div>
          </div>
        </div>

        <div class="mt-4">
          <label class="block mb-2 text-sm font-medium">
            Sexo
          </label>
          <div class="space-y-2">
            <div class="flex items-center">
              <input
                id="sexo-masculino"
                type="radio"
                value="Masculino"
                formControlName="sexo"
                class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500"
              >
              <label for="sexo-masculino" class="ms-2 text-sm font-medium">
                Masculino
              </label>
            </div>
            <div class="flex items-center">
              <input
                id="sexo-femenino"
                type="radio"
                value="Femenino"
                formControlName="sexo"
                class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500"
              >
              <label for="sexo-femenino" class="ms-2 text-sm font-medium">
                Femenino
              </label>
            </div>
          </div>
        </div>

        <!-- Botón Imprimir -->
        <div class="pt-4">
          <button
            type="button"
            (click)="imprimir()"
            class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
          >
          
          
            Subir Registro
          </button>
          <br/>
          
        </div>
        <br/>
        <button
    type="button"
    (click)="irARutaZodiaco()"
    class="w-full text-white bg-purple-700 hover:bg-purple-800 focus:ring-4 focus:outline-none focus:ring-purple-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
  >
    Ir a Zodiaco
  </button>

      </form>
    </div>

    <div class="border-t md:border-t-0 md:border-l border-gray-200 dark:border-gray-700 pt-6 md:pt-0 md:pl-8 flex flex-col items-center justify-center">
      <div class="max-w-6xl mx-auto mt-8">
 
 <h2 class="mb-4 text-2xl font-bold text-gray-900">
   Lista de usuarios
 </h2>
 <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
   <table class="w-full text-sm text-left text-gray-500">
 
     <thead class="text-xs text-gray-700 uppercase bg-gray-100">
       <tr>
         <th scope="col" class="px-15 py-2">
           Nombre
         </th>
         <th scope="col" class="px-15 py-2">
           Signo
         </th>
         <th scope="col" class="px-15 py-2">
           Edad
         </th>
         <th scope="col" class="px-15 py-2">
           Sexo
         </th>
         <th scope="col" class="px-15 py-2">
            Acciones
         </th>
       </tr>
     </thead>
 
     <tbody>
       <tr *ngFor="let usuario1 of usuarios let i = index"
         class="bg-white border-b border-gray-200 hover:bg-gray-50"
       >
         <td class="px-6 py-4">
           {{ usuario1.nombreCompleto }}
         </td>
         <td class="px-6 py-4">
           {{ usuario1.signo }}
         </td>
         <td class="px-6 py-4">
           {{ usuario1.edad }}
         </td>
         <td class="px-6 py-4">
           {{ usuario1.sexo }}
         </td>
         
         <td class="px-6 py-4">
           <div class="flex gap-2">
             <button
               type="button"
               class="px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 focus:ring-4 focus:outline-none focus:ring-green-300"
               (click)="editarResultado(i)"
             >
               Editar
             </button>
             <button
               type="button"
               class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-4 focus:outline-none focus:ring-red-300"
               (click)="eliminarUsuario(i)"
             >
               Eliminar
             </button>
           </div>
         </td>
       </tr>
     </tbody>
   </table>
 </div>
</div>
  </div>
